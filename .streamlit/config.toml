# InsightSQL theme: light (default) and dark, in the palette #EFECE3 / #8FABD4 / #4A70A9 / #000000.
# The colours come from LIGHT, DARK and CHART_COLORS in src/ui/theme.py; tests/test_theme.py checks
# that both files agree, so change them together.

[theme]
base = "light"
# Inter from Google Fonts when online; the system sans-serif when offline.
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
baseRadius = "0.75rem"
buttonRadius = "0.6rem"
showWidgetBorder = true
metricValueFontSize = "1.75rem"   # full values fit in four cards on a laptop screen
metricValueFontWeight = 650

[theme.light]
backgroundColor = "#EFECE3"
secondaryBackgroundColor = "#FAF9F6"
textColor = "#000000"
primaryColor = "#4A70A9"
linkColor = "#3B5D8F"
borderColor = "#75869F"
dataframeBorderColor = "#75869F"
dataframeHeaderBackgroundColor = "#E4E6E6"
dataframeHeaderTextColor = "#33322E"
codeBackgroundColor = "#FAF9F6"
codeTextColor = "#1F3A63"
greenColor = "#146B3E"
greenTextColor = "#146B3E"
yellowColor = "#8A5300"
yellowTextColor = "#8A5300"
redColor = "#B3261E"
redTextColor = "#B3261E"
blueColor = "#4A70A9"
blueTextColor = "#3B5D8F"
violetColor = "#4A70A9"
violetTextColor = "#3B5D8F"
linkUnderline = false
chartCategoricalColors = ["#4A70A9", "#2E8A87", "#B4693C", "#7A5BA6", "#5E8C3A", "#B04F6E"]

[theme.light.sidebar]
backgroundColor = "#DADEE0"
secondaryBackgroundColor = "#F3F4F4"

[theme.dark]
backgroundColor = "#0F1520"
secondaryBackgroundColor = "#18202E"
textColor = "#EFECE3"
primaryColor = "#4A70A9"
linkColor = "#8FABD4"
borderColor = "#66779A"
dataframeBorderColor = "#66779A"
dataframeHeaderBackgroundColor = "#151C29"
dataframeHeaderTextColor = "#C9CFDA"
codeBackgroundColor = "#18202E"
codeTextColor = "#C9D7EC"
greenColor = "#3DD68C"
greenTextColor = "#3DD68C"
yellowColor = "#F5B841"
yellowTextColor = "#F5B841"
redColor = "#F87171"
redTextColor = "#F87171"
blueColor = "#4A70A9"
blueTextColor = "#8FABD4"
violetColor = "#4A70A9"
violetTextColor = "#8FABD4"
linkUnderline = false
chartCategoricalColors = ["#4A70A9", "#2E8A87", "#B4693C", "#7A5BA6", "#5E8C3A", "#B04F6E"]

[theme.dark.sidebar]
backgroundColor = "#0B1019"
secondaryBackgroundColor = "#151C29"

[server]
maxUploadSize = 25   # MB; keep equal to INSIGHTSQL_IMPORT_MAX_MB (default 25)

[client]
# "viewer": no developer-only items such as "Deploy". The main menu it adds is hidden by the app's CSS;
# the sidebar "Dark mode" switch uses its Light / Dark items (src/ui/theme.py, THEME_SCRIPT).
toolbarMode = "viewer"
