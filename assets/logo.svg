<svg xmlns="http://www.w3.org/2000/svg" width="192" height="40" viewBox="0 0 192 40" role="img" aria-label="InsightSQL">
  <!-- Drawn 32 px tall in the sidebar, so the 24-unit wordmark shows at about 19 px bold: large text,
       where primary blue #4A70A9 (3.7:1 on the light sidebar, 3.8:1 on the dark one) meets the 3:1 rule. -->
  <rect x="0" y="2" width="36" height="36" rx="10" fill="#4A70A9"/>
  <rect x="8" y="22" width="4.5" height="9" rx="2" fill="#EFECE3"/>
  <rect x="15.75" y="16" width="4.5" height="15" rx="2" fill="#EFECE3"/>
  <rect x="23.5" y="10" width="4.5" height="21" rx="2" fill="#8FABD4"/>
  <text x="45" y="28.5" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#4A70A9">Insight<tspan font-weight="500">SQL</tspan></text>
</svg>
